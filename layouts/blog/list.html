{{ define "main" }}
<div class="page-hero">
  <div class="container">
    <h1 class="page-hero__title">Blog</h1>
    <p class="page-hero__subtitle">Articles on sound therapy, cymatics, and natural healing</p>
  </div>
</div>
<div class="container blog-list-page">
  <div class="blog-grid">
    {{ range .Pages }}
    <article class="blog-card">
      <div class="blog-card__body">
        <h2 class="blog-card__title">
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </h2>
        {{ with .Params.meta_description }}
        <p class="blog-card__desc">{{ . }}</p>
        {{ end }}
        <a href="{{ .RelPermalink }}" class="btn btn--teal btn--sm">Read more</a>
      </div>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
